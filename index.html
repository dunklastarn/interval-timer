<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,system-ui,sans-serif}
body{background:#111;color:#eee;min-height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:480px;padding:20px}
h1{font-size:22px;margin-bottom:16px;font-weight:600}
.card{background:#1c1c1e;border-radius:14px;padding:14px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center}
input{background:#2c2c2e;border:none;color:#eee;border-radius:10px;padding:12px;font-size:16px;width:100%}
input.num{width:80px;text-align:center}
button{border:none;border-radius:10px;padding:12px 16px;font-size:16px;font-weight:600;cursor:pointer;color:#fff;background:#2c2c2e}
.pri{background:#0a84ff}.go{background:#30d158;color:#000}.del{background:transparent;color:#ff453a;padding:8px}
.full{width:100%;margin-top:8px}
.t-item{display:flex;justify-content:space-between;align-items:center}
.t-item .info{cursor:pointer;flex:1}.sub{color:#8e8e93;font-size:14px;margin-top:4px}
label{font-size:13px;color:#8e8e93;display:block;margin:12px 0 6px}
.hidden{display:none!important}
#run{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#3a3a3c;overflow:hidden;padding:20px;text-align:center}
#rName{font-size:36px;font-weight:700}#rTime{font-size:110px;font-weight:200;font-variant-numeric:tabular-nums;margin:10px 0}
#rInfo{font-size:18px;opacity:.8}#rNext{font-size:16px;opacity:.6;margin-top:8px}
.ctrl{display:flex;gap:12px;margin-top:40px}.ctrl button{background:rgba(255,255,255,.2);min-width:90px}
.bar{position:absolute;bottom:0;left:0;right:0;height:100%;z-index:0;transition:height .2s linear}#run>*:not(.bar){position:relative;z-index:1}
</style></head><body><div class="app">

<div id="list"><h1>Interval Timer</h1><div id="timers"></div>
<button class="pri full" onclick="edit(null)">+ New timer</button></div>

<div id="editor" class="hidden"><h1 id="edTitle">New timer</h1>
<label>Timer name</label><input id="tName" placeholder="e.g. Tabata">
<label>Blocks (name · seconds)</label><div id="blocks"></div>
<button class="full" onclick="addBlock()">+ Add block</button>
<label>Repetitions of the whole set</label><input id="reps" class="num" type="number" min="1" value="8">
<button class="pri full" onclick="save()">Save</button>
<button class="full" onclick="show('list')">Cancel</button></div>

<div id="run" class="hidden"><div id="rName"></div><div id="rTime"></div><div id="rInfo"></div><div id="rNext"></div>
<div class="ctrl"><button id="pBtn" onclick="pause()">Pause</button><button onclick="skip()">Skip</button><button onclick="stop()">Stop</button></div>
<div class="bar" id="bar"></div></div>

</div><script>
const colors=['#0a84ff','#30d158','#ff9f0a','#bf5af2','#ff375f','#64d2ff'];
let timers=JSON.parse(localStorage.getItem('itimers')||'[]'),editIdx=null,st=null,ac=null,wl=null;
const $=id=>document.getElementById(id);
const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function show(v){['list','editor','run'].forEach(x=>$(x).classList.toggle('hidden',x!==v))}
function persist(){localStorage.setItem('itimers',JSON.stringify(timers))}
function renderList(){$('timers').innerHTML=timers.length?'':'<div class="sub">No timers yet.</div>';
timers.forEach((t,i)=>{const tot=t.blocks.reduce((a,b)=>a+b.sec,0)*t.reps;
const d=document.createElement('div');d.className='card t-item';
d.innerHTML=`<div class="info" onclick="edit(${i})"><b>${esc(t.name)}</b><div class="sub">${t.blocks.length} blocks × ${t.reps} · ${fmt(tot)}</div></div>
<button class="go" onclick="start(${i})">▶</button><button class="del" onclick="delT(${i})">✕</button>`;$('timers').appendChild(d)})}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function delT(i){if(confirm('Delete "'+timers[i].name+'"?')){timers.splice(i,1);persist();renderList()}}
function blockRow(n='',s=30){const r=document.createElement('div');r.className='row card';
r.innerHTML=`<input placeholder="Block name" value="${esc(n)}"><input class="num" type="number" min="1" value="${s}"><button class="del" onclick="this.parentNode.remove()">✕</button>`;return r}
function addBlock(){$('blocks').appendChild(blockRow())}
function edit(i){editIdx=i;const t=i===null?{name:'',blocks:[{name:'Work',sec:60},{name:'Rest',sec:20}],reps:8}:timers[i];
$('edTitle').textContent=i===null?'New timer':'Edit timer';$('tName').value=t.name;$('reps').value=t.reps;
$('blocks').innerHTML='';t.blocks.forEach(b=>$('blocks').appendChild(blockRow(b.name,b.sec)));show('editor')}
function save(){const blocks=[...$('blocks').children].map(r=>{const [n,s]=r.querySelectorAll('input');return{name:n.value.trim()||'Block',sec:Math.max(1,parseInt(s.value)||1)}});
if(!blocks.length)return alert('Add at least one block');
const t={name:$('tName').value.trim()||'Untitled',blocks,reps:Math.max(1,parseInt($('reps').value)||1)};
editIdx===null?timers.push(t):timers[editIdx]=t;persist();renderList();show('list')}
function say(txt){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.rate=1;speechSynthesis.speak(u)}
function beep(f=880,d=.12){if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.connect(g);g.connect(ac.destination);
g.gain.setValueAtTime(.3,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.start();o.stop(ac.currentTime+d)}
async function start(i){ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume();speechSynthesis.speak(new SpeechSynthesisUtterance(''));
try{wl=await navigator.wakeLock?.request('screen')}catch(e){}
st={t:timers[i],rep:0,bi:-1,left:0,paused:false};show('run');next()}
function next(){st.bi++;if(st.bi>=st.t.blocks.length){st.bi=0;st.rep++}
if(st.rep>=st.t.reps)return finish();const b=st.t.blocks[st.bi];st.left=b.sec;st.end=Date.now()+b.sec*1000;
say(b.name);draw();clearInterval(st.iv);st.iv=setInterval(tick,200)}
function tick(){if(st.paused)return;const l=Math.ceil((st.end-Date.now())/1000);
if(l!==st.left){st.left=l;if(l<=3&&l>0)beep();if(l<=0){beep(1320,.3);return next()}draw()}
$('bar').style.height=Math.max(0,100*(st.end-Date.now())/(st.t.blocks[st.bi].sec*1000))+'%'}
function draw(){const b=st.t.blocks[st.bi];const bar=$('bar');if(st.lastBi!==st.bi+'-'+st.rep){st.lastBi=st.bi+'-'+st.rep;bar.style.transition='none';bar.style.height='100%';bar.offsetHeight;bar.style.transition=''}bar.style.background=colors[st.bi%colors.length];
$('rName').textContent=b.name;$('rTime').textContent=fmt(Math.max(0,st.left));
$('rInfo').textContent='Round '+(st.rep+1)+' of '+st.t.reps;
const last=st.rep===st.t.reps-1&&st.bi===st.t.blocks.length-1;
$('rNext').textContent=last?'Last block':'Next: '+st.t.blocks[(st.bi+1)%st.t.blocks.length].name}
function pause(){if(st.done)return;st.paused=!st.paused;if(st.paused){st.rem=st.end-Date.now()}else{st.end=Date.now()+st.rem}$('pBtn').textContent=st.paused?'Resume':'Pause'}
function skip(){if(st.done)return;if(st.paused){st.paused=false;$('pBtn').textContent='Pause'}next()}
function finish(){clearInterval(st.iv);st.done=true;say('Workout complete');$('rName').textContent='Done!';$('rTime').textContent='0:00';$('rInfo').textContent=st.t.name;$('rNext').textContent='';$('bar').style.height='100%';$('bar').style.background='#30d158'}
function stop(){clearInterval(st?.iv);speechSynthesis.cancel();wl?.release?.();wl=null;$('pBtn').textContent='Pause';show('list')}
document.addEventListener('visibilitychange',async()=>{if(st&&!st.done&&document.visibilityState==='visible'&&!$('run').classList.contains('hidden')){try{wl=await navigator.wakeLock?.request('screen')}catch(e){}}});
renderList();
</script></body></html>
